[project]
name = "shm_evolve"
version = "0.1.0"
description = "A shared memory that reorganises itself within an episode, and an optimiser that evolves the prompts doing the reorganising across episodes."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: needs a model endpoint (MEMORY_LLM_BASE_URL / VLLM_BASE_URL); skipped offline",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
