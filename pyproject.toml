[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolving-privacy-mem"
version = "0.1.0"
description = "Privacy-governed agentic memory (A-MEM + V19 two-store runtime) with generated role policies, evaluated on GateMem."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.18",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    "rank_bm25>=0.2.2",
    "nltk>=3.8.1",
    "litellm>=1.16.11",
    "numpy>=1.24.3",
    "scikit-learn>=1.3.2",
    "openai>=1.3.7",
    "pre-commit>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
        "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_memory*"]
exclude = ["tests*"]

[project.urls]
"Homepage" = "https://github.com/agiresearch/A-mem"
"Bug Tracker" = "https://github.com/agiresearch/A-mem/issues"

[tool.pytest.ini_options]
minversion = "8.0"
# Bare `pytest` runs the harness and pipeline suites. Also: security_tests (skip the two *_v20.py
# files) and tests (the original A-MEM; needs nltk and chromadb). See README.md.
testpaths = ["evaluation/gatemem_medical/tests", "pipeline/tests"]
addopts = "-q"
pythonpath = ["."]
